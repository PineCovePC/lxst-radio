<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0b120e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./extra.css" />
    <title>LXST Radio</title>
  </head>
  <body>
    <div class="app">
      <div class="status">
        <strong id="clock">--:--</strong>
        <span>LXST</span>
        <span class="bars" id="bars"></span>
      </div>
      <div class="banner" id="banner" hidden>
        <span>Install LXST on this phone</span>
        <button class="ghost" id="btn-install" type="button">Add</button>
      </div>
      <div class="tabs four">
        <button class="active" data-tab="radio" type="button">radio</button>
        <button data-tab="mesh" type="button">mesh</button>
        <button data-tab="chat" type="button">chat</button>
        <button data-tab="id" type="button">id</button>
      </div>
      <div class="stage">
        <section data-panel="radio">
          <div class="card">
            <div class="kicker">Local station</div>
            <div class="hash" id="call"></div>
            <div class="muted" id="direct-line">Broadcast · all heard</div>
          </div>
          <div class="ptt-wrap">
            <button class="ptt" id="ptt" type="button">
              <span id="ptt-label">PTT</span>
              <small id="ptt-cap">HOLD / DBL TAP</small>
            </button>
            <div class="hint">Hold to talk. Double-tap to latch.</div>
          </div>
          <div class="log" id="log"></div>
        </section>
        <section data-panel="mesh" hidden>
          <div class="radar-wrap">
            <canvas id="radar" width="360" height="360"></canvas>
            <div class="radar-legend"><span>tap a station</span></div>
          </div>
          <div id="station-sheet" class="station-sheet" hidden>
            <div>
              <strong id="sheet-name">—</strong>
              <div class="hash" id="sheet-hash"></div>
              <div class="muted" id="sheet-meta"></div>
            </div>
            <div class="sheet-actions">
              <button type="button" data-act="chat">Open chat</button>
              <button type="button" data-act="ptt">Direct PTT</button>
              <button type="button" data-act="pin">Pin</button>
              <button type="button" data-act="mute">Mute</button>
            </div>
          </div>
        </section>
        <section data-panel="chat" hidden>
          <div id="chat-home">
            <div class="muted">Tap a station on mesh, or pick a thread.</div>
            <div id="thread-list" class="thread-list"></div>
          </div>
          <div id="chat-room" hidden>
            <div class="chat-head">
              <button type="button" id="chat-back" class="ghost tiny">Threads</button>
              <div>
                <strong id="chat-title">Chat</strong>
                <div class="muted" id="chat-sub"></div>
              </div>
            </div>
            <div class="msgs" id="msgs"></div>
            <form id="chat-form">
              <input id="chat-input" maxlength="280" placeholder="Message…" autocomplete="off" />
              <button type="submit">Send</button>
            </form>
          </div>
        </section>
        <section data-panel="id" hidden>
          <div class="card">
            <div class="kicker">Identity</div>
            <div class="hash" id="fullhash"></div>
            <p class="muted" style="margin-top:10px">Callsign <span id="idname"></span>. Stored on this device only.</p>
            <div class="actions">
              <button id="btn-rename" type="button">Rename</button>
              <button id="btn-newid" type="button">New identity</button>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
