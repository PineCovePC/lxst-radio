<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0c0f0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LXST" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Push-to-talk radio over a Reticulum-style cryptographic mesh." />
    <title>LXST</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="./styles.css?v=7" />
  </head>
  <body>
    <div class="shell">
      <div class="status">
        <span id="clock">--:--</span>
        <span id="status-mark">LXST</span>
        <span class="bars" id="bars" aria-hidden="true"></span>
      </div>
      <header class="top">
        <div class="brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="8" r="3" fill="#7ec99a" />
            <circle cx="7" cy="23" r="3" fill="#e8eee9" />
            <circle cx="25" cy="23" r="3" fill="#e8eee9" opacity="0.7" />
            <path d="M14 10.2 9.2 20.4" stroke="#7ec99a" stroke-width="1.4" fill="none" opacity="0.8" />
            <path d="M18 10.2 22.8 20.4" stroke="#e8eee9" stroke-width="1.4" fill="none" opacity="0.4" />
            <path d="M10.4 23h11.2" stroke="#e8eee9" stroke-width="1.4" fill="none" opacity="0.35" />
          </svg>
          <div>
            <p class="name">LXST</p>
            <p class="mono dim" id="hdr-hash">booting</p>
          </div>
        </div>
        <div class="right">
          <p class="call" id="hdr-call">—</p>
          <p class="mono dim" id="hdr-sta">0 sta</p>
        </div>
      </header>
      <main id="main"></main>
      <nav id="nav" hidden>
        <button type="button" data-tab="radio" class="on">Radio</button>
        <button type="button" data-tab="mesh">Mesh</button>
        <button type="button" data-tab="chat">Chat</button>
        <button type="button" data-tab="id">Identity</button>
      </nav>
      <div class="home"><i></i></div>
    </div>
    <script src="./core.js?v=7"></script>
    <script src="./boot.js?v=7"></script>
  </body>
</html>
